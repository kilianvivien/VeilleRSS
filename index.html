<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Ne pas utiliser `viewport-fit=cover` ici. Dans une PWA iOS autonome,
         WebKit peut alors calculer le layout viewport sur 812 px pour un écran
         de 874 px et laisser une bande système inaccessible sous la barre
         basse. Sans `cover`, iOS borne lui-même la web view à la zone utile ;
         `100dvh` remplit ensuite exactement cette zone, comme dans Calqo.

         CONSÉQUENCE ASSUMÉE : `env(safe-area-inset-*)` vaut donc 0 en PWA iOS
         autonome. Les marges de sécurité présentes dans l'interface restent
         utiles sur Android et dans Safari en mode navigateur — ne les retirez
         pas, et ne « réparez » pas leur inertie iOS en réintroduisant `cover`
         sans avoir revalidé le bug de hauteur ci-dessus sur appareil réel. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Outil de veille RSS — lecteur de flux, tendances et briefing" />
    <!-- PWA : manifeste + comportement d'app installée. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Veille RSS" />
    <!-- `black-translucent` n'a de sens qu'avec `viewport-fit=cover` : sans lui,
         WebKit ignore la translucidité et le rendu de la barre devient
         imprévisible. `default` est la seule valeur qui ne fige pas une
         couleur en conflit avec l'un des deux thèmes. iOS ne lit cette balise
         qu'AU LANCEMENT : inutile de tenter de la permuter à l'exécution. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Couleur d'accent du thème ; variante sombre pour la barre système. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#6a5ae0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d12" />
    <title>Outil de veille RSS</title>
    <style>
      /* Peint le fond thémé dès la première frame pour éviter tout flash blanc. */
      :root {
        color-scheme: light dark;
      }
      html {
        background-color: #fbfbfd;
      }
      html.dark {
        background-color: #0b0d12;
      }
    </style>
    <script>
      // Amorçage du thème sans flash : applique la classe `dark` de façon
      // synchrone, avant le chargement du bundle. L'app reflète le réglage
      // persistant dans cette clé localStorage à chaque changement.
      (function () {
        try {
          var storedTheme = window.localStorage.getItem('veille-web-theme')
          var isDark =
            storedTheme === 'dark' ||
            (storedTheme !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
          if (isDark) {
            document.documentElement.classList.add('dark')
          } else {
            document.documentElement.classList.remove('dark')
          }
        } catch (e) {
          /* matchMedia indisponible — on reste en clair. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
